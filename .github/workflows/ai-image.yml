name: AI 이미지 빌드·푸시 (GHCR)

# ai/server 변경 시 통합 AI 추론 서버 이미지를 GHCR에 푸시한다.
# EC2 prod compose 는 이 이미지를 pull 해서 백엔드와 함께 구동한다.
#   image: ghcr.io/taennny/roame-ai:latest   ← 컨벤션 다르면 IMAGE_NAME 만 수정

on:
  push:
    branches: [main]
    paths:
      - 'ai/server/**'
      - '.github/workflows/ai-image.yml'
  workflow_dispatch: {}  # 수동 실행 허용

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: taennny/roame-ai

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 태그 메타데이터
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: 빌드 & 푸시
        uses: docker/build-push-action@v6
        with:
          context: ai/server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
