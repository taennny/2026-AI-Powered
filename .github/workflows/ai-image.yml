name: AI 이미지 빌드·푸시 (GHCR)

# ai/server 변경 시 통합 AI 추론 서버 이미지를 GHCR에 빌드·푸시하고,
# AI 전용 EC2 에 SSH 접속해 새 이미지를 pull 하여 자동 재배포한다.
#   image: ghcr.io/taennny/roame-ai:latest   ← 컨벤션 다르면 IMAGE_NAME 만 수정
#
# ── 자동 배포 사전 준비 (최초 1회) ─────────────────────────────
# 1) GitHub → Settings → Secrets and variables → Actions 에 등록:
#      AI_EC2_HOST     AI 서버 EC2 퍼블릭 IP/도메인
#      AI_EC2_USER     SSH 유저 (예: ubuntu / ec2-user)
#      AI_EC2_SSH_KEY  해당 EC2 접속용 개인키 (전체 내용)
# 2) AI EC2 의 ~/roame-ai/ 디렉터리에 아래 두 파일을 미리 배치:
#      docker-compose.prod.yml   (ai/server/docker-compose.prod.yml 복사본)
#      .env                      (OPENAI_API_KEY / KAKAO_API_KEY / OPENAI_MODEL)
#   → 시크릿 미설정 상태로 main 에 머지하면 deploy 잡이 실패하니 먼저 등록할 것.
#
# ※ 만약 AI 를 백엔드와 같은 EC2 에서 돌린다면: 이 deploy 잡 대신
#   backend/docker-compose.prod.yml 에 ai 서비스를 넣고 cd.yml 로 함께 배포.

on:
  push:
    branches: [main]
    paths:
      - 'ai/server/**'
      - '.github/workflows/ai-image.yml'
  workflow_dispatch: {}  # 수동 실행 허용

concurrency:
  group: deploy-ai
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: taennny/roame-ai

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 태그 메타데이터
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: 빌드 & 푸시
        uses: docker/build-push-action@v6
        with:
          context: ai/server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: AI EC2 재배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AI_EC2_HOST }}
          username: ${{ secrets.AI_EC2_USER }}
          key: ${{ secrets.AI_EC2_SSH_KEY }}
          script: |
            cd ~/roame-ai
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
