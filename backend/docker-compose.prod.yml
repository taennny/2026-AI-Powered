
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: roame-db
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - roame-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: roame-minio
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    expose:
      - "9000"
    volumes:
      - roame-minio-data:/data
    command: server /data

  backend:
    image: ghcr.io/taennny/2026-ai-powered-backend:latest
    container_name: roame-backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

  # HTTPS 리버스 프록시 — api.roame.co.kr(443) → backend:8000
  # 경로 라우팅: /roame-photos/* 는 MinIO로 (presigned URL 사진 접근), 나머지는 backend (Caddyfile 참조)
  # Let's Encrypt 인증서 자동 발급·갱신 (도메인 A레코드가 이 서버를 가리켜야 발급됨)
  caddy:
    image: caddy:2-alpine
    container_name: roame-caddy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - roame-caddy-data:/data  # 인증서 영속화 (재기동 시 재발급/rate limit 방지)
      - roame-caddy-config:/config
    depends_on:
      - backend

volumes:
  roame-db-data:
  roame-minio-data:
  roame-caddy-data:
  roame-caddy-config:
